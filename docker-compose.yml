services:
  # MongoDB Database Service
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  # Subscription Tracker Express API Service
  api:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-5400}:5400"
    env_file:
      - .env
    depends_on:
      - mongo
    networks:
      - app-network

volumes:
  mongo-data:
    driver: local

networks:
  app-network:
    driver: bridge
